const CRITERIA = [
  { k: "Corrosion", hint: "Extra safety margin against rust", col: "#6FB3D2" },
  { k: "Strength", hint: "Extra margin on the load it carries", col: "#8FD9AE" },
  { k: "Fabrication", hint: "How easy it is to weld, bend and machine", col: "#C9B2D6" },
  { k: "Cost", hint: "A lower price per tonne", col: "#F4B98F" },
];

/* Turn a weight into words a non-engineer can read. Percent is this factor's
   share of the whole decision, so the four always add up to 100%. */
const weightWord = (pct) =>
  pct === 0 ? "Ignored" : pct < 10 ? "Barely counts" : pct < 20 ? "Counts a little" :
  pct < 30 ? "Counts a fair amount" : pct < 45 ? "Counts a lot" : "Matters most of all";

function shares(w) {
  const t = w.reduce((a, b) => a + b, 0);
  if (!t) return w.map(() => 25);
  const raw = w.map((x) => (x / t) * 100);
  const r = raw.map(Math.floor);
  let left = 100 - r.reduce((a, b) => a + b, 0);
  raw.map((x, i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0])
    .forEach(([, i]) => { if (left > 0) { r[i]++; left--; } });
  return r;
}

const LEAN = ["cared more about rust", "needed more strength margin",
  "wanted easier welding and forming", "wanted the lowest price"];

function Split({ s, top }) {
  const w = s.w, p = shares(w);
  const order = p.map((v, i) => i).sort((a, b) => p[b] - p[a]);
  const most = CRITERIA[order[0]].k.toLowerCase(), least = CRITERIA[order[3]].k.toLowerCase();
  const allEqual = Math.max(...p) - Math.min(...p) <= 2;
  const cheap = s.pri === "cheap";

  // What-if: make each factor dominant in turn and see who would win instead.
  // This turns abstract weights into an outcome anyone can read.
  const whatIf = useMemo(() => {
    if (!top) return [];
    return CRITERIA.map((c, i) => {
      // "Cares more" = this factor's weight tripled, the rest kept as they are.
      const w2 = w.map((x, j) => (j === i ? Math.max(x * 3, 30) : x));
      const alt = runCase({ ...s, w: w2, pri: "custom" }).ranked[0];
      return { i, alt };
    });
  }, [s, top]);

  return (
    <div className="split">
      <p className="split-h">How the winner is picked</p>
      {cheap ? (
        <p className="split-say" style={{ marginTop: 0 }}>
          <b>Purely on price.</b> Every grade listed already passes your requirements, so the
          cheapest one wins. The factor weights below only break exact ties.
        </p>
      ) : (<>
        <div className="split-bar" role="img"
          aria-label={CRITERIA.map((c, i) => `${c.k} ${p[i]}%`).join(", ")}>
          {CRITERIA.map((c, i) => p[i] > 0 && (
            <span key={c.k} style={{ width: `${p[i]}%`, background: c.col }} />
          ))}
        </div>
        <div className="split-key">
          {CRITERIA.map((c, i) => (
            <span key={c.k}><i style={{ background: c.col }} />{c.k} <b>{p[i]}%</b></span>
          ))}
        </div>
        <p className="split-say">
          {allEqual ? "All four count about equally."
            : `${most[0].toUpperCase() + most.slice(1)} counts most, ${least} counts least.`}
          {" "}Every grade here already passes your requirements, so this only decides
          which of the safe options wins.
        </p>
      </>)}

      {top && whatIf.length > 0 && (
        <div className="whatif">
          <p className="split-h" style={{ margin: "14px 0 8px" }}>What if you…</p>
          {whatIf.map(({ i, alt }) => {
            const same = !alt || alt.n === top.n;
            const d = alt ? Math.round((alt.ci / top.ci - 1) * 100) : 0;
            return (
              <div key={i} className="wi-row">
                <i style={{ background: CRITERIA[i].col }} />
                <span className="wi-q">{LEAN[i]}</span>
                <span className="wi-a">
                  {same ? <em>still {top.n}</em> : <>
                    <b>{alt.n}</b>
                    <small className={d > 0 ? "up" : d < 0 ? "down" : ""}>
                      {d === 0 ? "same price" : d > 0 ? `${d}% dearer` : `${-d}% cheaper`}
                    </small>
                  </>}
                </span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

   survivors. Every reason carries both a plain sentence and the numbers, so
   one engine drives both reading levels.                                    */

const AQUEOUS_LIMIT = 150;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

   corrosion resistance classes of EN 1993-1-4 (CRC I ≈ 430, II ≈ 304,
   III ≈ 316, IV ≈ 2205, V ≈ 2507). "Looks matter" asks for the class that
   avoids visible staining; switching it off accepts light surface staining
   on a part that only has to keep working, as on painted wagons or exhausts. */

  { max: 20,       looks: 10.5, func: 10.5 },   // dry indoor air
  { max: 100,      looks: 16.0, func: 10.5 },   // inland outdoor
  { max: 500,      looks: 17.5, func: 11.5 },   // urban or industrial
  { max: 3000,     looks: 23.0, func: 17.5 },   // near the coast
  { max: 15000,    looks: 25.0, func: 23.0 },   // coastal salt spray
  { max: Infinity, looks: 32.0, func: 30.0 },   // splash zone
];

   ambient temperature: 304 to about 200 ppm chloride, 316 to about 1000 ppm,
   2205 to about 3600 ppm, superduplex and 6Mo for seawater. Interpolated in
   log chloride, then raised 0.08 PREN per °C above 25°C up to 100°C. */
const WET_ANCHORS = [[10, 12], [200, 18], [1000, 24], [3600, 34], [20000, 40]];
function wetPren(cl, temp) {
  const x = Math.log10(Math.max(cl, 10));
  let v = WET_ANCHORS[WET_ANCHORS.length - 1][1];
  for (let i = 0; i < WET_ANCHORS.length - 1; i++) {
    const [c0, p0] = WET_ANCHORS[i], [c1, p1] = WET_ANCHORS[i + 1];
    if (cl <= c1) {
      const f = (x - Math.log10(c0)) / (Math.log10(c1) - Math.log10(c0));
      v = p0 + clamp(f, 0, 1) * (p1 - p0); break;
    }
  }
  return v + 0.08 * clamp(temp - 25, 0, 75);
}

function requirement(cl, temp, wet, looks) {
  if (temp > AQUEOUS_LIMIT)
    return { mode: "dry", v: temp, plain: "staying intact in dry heat",
             tech: `oxidation resistance above ${temp}°C` };
  if (wet) {
    const v = wetPren(cl, temp);
    return { mode: "pren", v, wet: true, plain: "not pitting in this water",
             tech: `PREN of at least ${v.toFixed(1)} for wet service` };
  }
  const band = AIR_REQ.find((b) => cl < b.max);
  const v = looks ? band.looks : band.func;
  return { mode: "pren", v, wet: false,
           plain: looks ? "staying clean and rust-free in this air" : "not corroding in this air",
           tech: `PREN of at least ${v.toFixed(1)} (${looks ? "appearance" : "function only"})` };
}

/* Annealed minimum yield is a design input, not a pass/fail gate: a weaker
   grade can still be used in a thicker section. Only reject below 70% of the
   requirement, where the extra thickness stops being practical. */
const YIELD_FLOOR = 0.7;

function screen(g, s, q) {
  const r = [];
  const add = (plain, tech) => r.push({ plain, tech });
  if (q.mode === "pren" && g.pren < q.v)
    add(q.wet ? "Would pit in this water" :
        s.looks ? "Would stain or rust in this air" : "Would corrode in this air",
        `PREN ${g.pren.toFixed(1)} against the ${q.v.toFixed(1)} required`);
  if (s.temp <= AQUEOUS_LIMIT && s.cl >= 100 && s.temp > g.scc)
    add("Would crack in hot salty conditions",
        `chloride SCC threshold ${g.scc}°C, service at ${s.temp}°C`);
  if (g.tmax < s.temp)
    add("Too hot for this grade", `max continuous service ${g.tmax}°C`);
  if (g.ys !== null && g.ys < s.ys * YIELD_FLOOR)
    add("Far too weak for this load",
        `${g.ys} MPa yield, needs over ${Math.round((s.ys / g.ys - 1) * 100)}% thicker sections`);
  if (s.impact && (g.f === "ferritic" || g.f === "martensitic" || g.f === "PH"))
    add("Too brittle for impact or crash loads",
        "ferritic and martensitic grades lose toughness at low temperature and absorb little crash energy");
  if (s.nonmag && g.mag !== false)
    add(g.mag === "weak" ? "Turns magnetic once formed" : "Magnetic",
        g.mag === "weak" ? "strain-induced martensite on cold work"
                         : "ferritic or duplex, ferromagnetic");
  if (s.weld && !s.pwht && q.wet && s.cl >= 100 && s.temp <= AQUEOUS_LIMIT && g.sens >= 4)
    add("Welds would corrode along the seam",
        `${g.c.toFixed(2)}% C unstabilised, chromium carbide precipitation in wet service`);
  if (s.weld && g.weld <= 1)
    add("Cannot be welded by normal shop practice",
        "hot cracking or severe as-welded embrittlement");
  if (s.draw && g.form <= 2)
    add("Would tear when deep drawn", "insufficient ductility for severe forming");
  if (s.food && (g.mach === 5 || g.pren < 12))
    add("Not suitable for food contact", "free-machining sulphur, or under 12% chromium");
  if (s.machined && g.mach <= 1)
    add("Very hard to machine in volume", "work-hardening duplex, poor tool life");
  return r;
}

const PREN_MARGIN = 3;   // half an EN 1993-1-4 class step: beyond this, no extra credit
function adequacy(g, q) {
  // Saturating rather than maximising: once a grade comfortably clears the
  // requirement, extra corrosion resistance earns it nothing. This is what
  // stops the engine recommending a super-austenitic for a kitchen sink.
  if (q.mode === "pren") return clamp((g.pren - q.v) / PREN_MARGIN, 0, 1);
  return clamp((g.tmax - q.v) / 150, 0, 1);
}

function topsis(sv, w0, s, q) {
  if (!sv.length) return [];
  if (sv.length === 1) return [{ ...sv[0], score: 1 }];
  const cols = sv.map((g) => [
    adequacy(g, q),
    clamp(((g.ys ?? g.ysr ?? 200) / s.ys - YIELD_FLOOR) / 0.45, 0, 1),
    s.draw ? (g.form * 2 + g.weld + g.mach) / 4 : (g.form + g.weld + g.mach) / 3,
    g.ci,
  ]);
  const ws = w0.reduce((a, b) => a + b, 0) || 1;
  const w = w0.map((x) => x / ws);
  const norm = [0, 1, 2, 3].map(
    (j) => Math.sqrt(cols.reduce((a, r) => a + r[j] * r[j], 0)) || 1);
  const V = cols.map((r) => r.map((v, j) => (v / norm[j]) * w[j]));
  const best = [0, 1, 2, 3].map((j) =>
    j === 3 ? Math.min(...V.map((r) => r[j])) : Math.max(...V.map((r) => r[j])));
  const worst = [0, 1, 2, 3].map((j) =>
    j === 3 ? Math.max(...V.map((r) => r[j])) : Math.min(...V.map((r) => r[j])));
  return sv.map((g, i) => {
    const dp = Math.sqrt(V[i].reduce((a, v, j) => a + (v - best[j]) ** 2, 0));
    const dn = Math.sqrt(V[i].reduce((a, v, j) => a + (v - worst[j]) ** 2, 0));
    return { ...g, score: dp + dn === 0 ? 0 : dn / (dp + dn) };
  }).sort((a, b) => b.score - a.score);
}

/* Grades in Jindal Stainless's published product range (jindalstainless.com
   product brochure page, checked Oct 2026). Every grade in the database is
   JSL-made except these four. */
const NOT_JSL = new Set(["303", "254 SMO", "2202", "17-4 PH"]);
GRADES.forEach((g) => { g.mk = !NOT_JSL.has(g.n); });

function rankAll(s, q, pool) {
  const pass = [], cut = [];
  pool.forEach((g) => {
    const r = screen(g, s, q);
    if (r.length) cut.push({ ...g, reasons: r }); else pass.push(g);
  });
  let ranked = topsis(pass, s.w, s, q);
  // "Cheapest that works" means exactly that: every survivor already passes,
  // so sort by price, using the weighted score only to break exact ties.
  if (s.pri === "cheap")
    ranked = [...ranked].sort((a, b) => a.ci - b.ci || b.score - a.score);
  return { ranked, cut };
}

function runCase(s) {
  const q = requirement(s.cl, s.temp, s.wet, s.looks);
  const all = rankAll(s, q, GRADES);
  if (!s.jslOnly) return { q, ...all, outside: null, nearest: null };

  const { ranked, cut } = rankAll(s, q, GRADES.filter((g) => g.mk));
  GRADES.filter((g) => !g.mk).forEach((g) => cut.push({ ...g,
    reasons: [{ plain: "Not in Jindal Stainless's range", tech: "outside JSL product catalogue" }] }));
  // The best answer from the whole market, if JSL's range gives a different one.
  const outside = all.ranked[0] && !all.ranked[0].mk ? all.ranked[0] : null;
  // If JSL has nothing that passes, the JSL grade that misses on the fewest
  // requirements, then the one with the most corrosion resistance.
  const nearest = ranked.length ? null : cut.filter((g) => g.mk)
    .sort((a, b) => a.reasons.length - b.reasons.length || b.pren - a.pren)[0] || null;
  return { q, ranked, cut, outside, nearest };
}

        /* ---- dark theme: tonal tiles, no borders, pastel active states ---- */

        .dark .rec .kick{color:var(--peach);}
        .dark .gname{color:var(--tx);}
        .dark .gsub,.dark .kv span{color:var(--tx2);}
        .dark .kv{border-bottom:1px solid rgba(255,255,255,.06);}
        .dark .kv b{color:var(--tx);}
        .dark .stat-n{color:var(--blue);}
        .dark .verdict b{color:var(--tx);}

        .themebtn{position:absolute;right:30px;top:76px;border:1px solid #CBD5E1;background:#FFFFFF;

        .fw-row .fld-top b{font-size:12.5px;}
        .catsw{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:none;
          background:#EEF2F8;border-radius:18px;padding:12px 14px;margin:0 0 20px;font:inherit;cursor:pointer;color:${INK};}
        .catsw b{display:block;font-family:Arial,sans-serif;font-size:13.5px;}

        .catsw .knob{flex:0 0 40px;height:22px;border-radius:999px;background:#CBD5E1;position:relative;
          transition:background .2s ease;}
        .catsw .knob::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;
          background:#FFFFFF;transition:transform .2s cubic-bezier(.2,.7,.2,1);}
        .catsw.on .knob{background:${ORANGE};}

        .dark .catsw{background:var(--tile2);color:var(--tx);}
        .dark .catsw small{color:var(--tx2);}
        .dark .catsw .knob{background:var(--tile3);}
        .dark .catsw.on{background:var(--peach);color:var(--peachInk);}
        .dark .catsw.on small{color:var(--peachInk);}

        .dark .wi-a small.up{color:var(--peach);} .dark .wi-a small.down{color:#8FD9AE;}
      `}</style>

      <div className="wrap">
        <header className="mast">
          <div className="brand">
            {logoOk && <img className="logo" src="jsl-logo.png" alt="Jindal Stainless"
              onError={() => setLogoOk(false)} />}
            <p className="kick">JINDAL STAINLESS · STAINLESS SPARK 2026</p>
          </div>
          <h1>Which stainless steel should I use?</h1>
          <p>Describe the job. The tool screens {GRADES.length} grades, including Jindal Stainless's own, and explains every rejection.</p>
          <button className={"engbtn" + (eng ? " on" : "")} onClick={() => setEng(!eng)}
            aria-pressed={eng}>
            <span className="dot" />{eng ? "Engineering detail on" : "Show the engineering"}
          </button>
          <button className="themebtn" onClick={flipTheme} aria-pressed={dark}>
            {dark ? "Light mode" : "Dark mode"}
          </button>
        </header>

        <div className="body">
          <div className="presets">
            {PRESETS.map((p, i) => (
              <button key={p.label} className={"pre" + (preset === i ? " on" : "")}
                onClick={() => { setS({ ...p.s, jslOnly: s.jslOnly }); setPreset(i); setOpen(null); }}>
                {p.label}
              </button>
            ))}
          </div>

          <div className="grid">
            <aside className="rail">
              <button className={"catsw" + (s.jslOnly ? " on" : "")} aria-pressed={!!s.jslOnly}
                onClick={() => setS({ ...s, jslOnly: !s.jslOnly })}>
                <span className="knob" />
                <span><b>JSL catalogue only</b>
                  <small>{s.jslOnly ? `Choosing from the ${GRADES.filter((g) => g.mk).length} grades Jindal Stainless makes`
                    : `Choosing from all ${GRADES.length} grades on the market`}</small></span>
              </button>

              <div className="sec"><Disc n={1} /><h3>Where will it be used?</h3></div>
              <p className="sechint">How salty and how hot the surroundings get.</p>
              <div className="tgls" style={{ marginBottom: 14 }}>
                <Toggle label="Wet or immersed" on={!!s.wet} onChange={(v) => set("wet", v)} />
                <Toggle label="Appearance matters" on={!!s.looks} onChange={(v) => set("looks", v)} />
              </div>
              <Slider label="Environment" band={chlorideBand(s.cl, s.wet)} eng={eng}
                value={s.cl} min={0} max={25000} step={50} unit=" ppm chloride"
                onChange={(v) => set("cl", v)} />
              <Slider label="Temperature" band={tempBand(s.temp)} eng={eng}
                value={s.temp} min={-20} max={900} step={5} unit=" °C"
                onChange={(v) => set("temp", v)} />

              <div className="sec"><Disc n={2} /><h3>How hard will it work?</h3></div>
              <p className="sechint">The load the part has to carry.</p>
              <Slider label="Load" band={strengthBand(s.ys)} eng={eng}
                value={s.ys} min={100} max={600} step={10} unit=" MPa yield"
                onChange={(v) => set("ys", v)} />

              <div className="sec"><Disc n={3} /><h3>How is it made and used?</h3></div>
              <p className="sechint">Tap everything that applies.</p>
              <div className="tgls">
                <Toggle label="Welded" on={s.weld} onChange={(v) => set("weld", v)} />
                <Toggle label="Heat treated after welding" on={s.pwht} onChange={(v) => set("pwht", v)} />
                <Toggle label="Deep drawn or pressed" on={s.draw} onChange={(v) => set("draw", v)} />
                <Toggle label="Heavily machined" on={s.machined} onChange={(v) => set("machined", v)} />
                <Toggle label="Impact, crash or sub-zero" on={!!s.impact} onChange={(v) => set("impact", v)} />
                <Toggle label="Must not be magnetic" on={s.nonmag} onChange={(v) => set("nonmag", v)} />
                <Toggle label="Touches food or medicine" on={s.food} onChange={(v) => set("food", v)} />
              </div>

              <div className="sec"><Disc n={4} /><h3>What matters most?</h3></div>
              <p className="sechint">Every grade that survives already works. This decides which one wins.</p>
              <div className="pris">
                {Object.entries(PRIORITIES).map(([k, v]) => (
                  <button key={k} className={"pri" + (s.pri === k ? " on" : "")}
                    aria-pressed={s.pri === k}
                    onClick={() => { setS({ ...s, pri: k, w: v.w }); setPreset(-1); }}>
                    <b>{v.label}</b><span>{v.hint}</span>
                  </button>
                ))}
              </div>
              <Split s={s} top={top} />
              {eng && (
                <div className="fine">
                  <p className="fine-h">Fine-tune the weights</p>
                  <p className="fw-intro">Drag a slider to make that factor count for more or less.
                    The percentages always add up to 100%, so raising one lowers the share of
                    the others.</p>
                  {CRITERIA.map((c, i) => (
                    <div key={c.k} className="fw-row">
                      <Slider label={c.k}
                        band={`${weightWord(shares(s.w)[i])} · ${shares(s.w)[i]}%`} eng={false}
                        value={s.w[i]} min={0} max={100} step={5} unit=""
                        onChange={(v) => setW(i, v)} />
                      <p className="fw-hint">{c.hint}</p>
                    </div>
                  ))}
                </div>
              )}
            </aside>

            <main>
              {!top ? (
                <div className="panel"><div className="empty">
                  {s.jslOnly && nearest ? (<>
                    <b>Jindal Stainless's range doesn't cover this job.</b>
                    The nearest JSL option is <b className="inl">{nearest.n}</b>, which
                    still falls short on: {nearest.reasons.map((r) => r.plain.toLowerCase()).join("; ")}.
                    {outside && <> Outside JSL's range, <b className="inl">{outside.n}</b> would do it.</>}
                  </>) : (<>
                    <b>Nothing in the catalogue can do all of this.</b>
                    Try a lower load, allow a magnetic grade, or heat treat after welding.
                    The list below shows which requirement is doing the damage.
                  </>)}
                </div></div>
              ) : (
                <div className="panel anim" key={top.n}>
                  <div className="panel-h">
                    <h2>Use this grade</h2>
                    {eng && <span>TOPSIS Ci {top.score.toFixed(3)}
</span>}
                  </div>
                  <div className="pad win">
                    <div>
                      <p className="verdict">
                        For {chlorideBand(s.cl, s.wet).toLowerCase()} at {s.temp}°C,
                        the deciding factor is {q.plain}. <b>{top.n}</b> handles it
                        {s.weld && top.sens <= 2 && ", and welds cleanly"}
                        {s.temp > 60 && s.cl >= 100 && top.scc > s.temp &&
                          ", and will not crack in hot salt water the way ordinary 304 and 316 do"}
                        . It costs about {top.ci.toFixed(2)} times what plain 304 costs.
                        {eng && <span className="tech">
                          {q.mode === "pren" && `PREN ${top.pren.toFixed(1)} vs ${q.v.toFixed(1)} required`}
                          {q.mode === "dry" && `max continuous service ${top.tmax}°C vs ${s.temp}°C`}
                          {` · SCC limit ${top.scc}°C · sensitization risk ${top.sens} of 5`}
                        </span>}
                      </p>

                      {tiedTop.length > 0 && (
                        <p className="tienote fadein">
                          Effectively tied with <b>{tiedTop.map((g) => g.n).join(", ")}</b> — {s.pri === "cheap"
                            ? `within 3% of the price of ${top.n}, which is inside the uncertainty of a cost index`
                            : `their scores differ from ${top.n} by less than this model can resolve`}. Treat them
                          as interchangeable and decide on availability, lead time, or a live quote.
                        </p>
                      )}

                      <div className="stats" style={{ marginTop: 22 }}>
                        <div>
                          <div className="stat-n">{eng ? top.pren.toFixed(1)
                            : clamp(Math.round((top.pren - 11) / 6.5 * 20), 1, 100)}</div>
                          <div className="stat-l">{eng ? "PREN" : "Corrosion score"}</div>
                        </div>
                        <div>
                          <div className="stat-n">{top.ys ?? (top.ysr ? `~${top.ysr}` : "—")}</div>
                          <div className="stat-l">{top.ys ? "MPa yield strength" : top.ysr ? "MPa yield, hardened/aged (typical)" : "Yield not in A240"}</div>
                        </div>
                        <div>
                          <div className="stat-n">{top.tmax}°</div>
                          <div className="stat-l">Max service temperature, °C</div>
                        </div>
                        <div>
                          <div className="stat-n">{top.ci.toFixed(2)}×</div>
                          <div className="stat-l">Cost relative to 304</div>
                        </div>
                      </div>

                      {outside && (
                        <div className="flag out fadein">
                          <b>Outside JSL's range. </b>
                          Across the whole market, {outside.n} would rank first here. Jindal
                          Stainless doesn't list it, so {top.n} is the best grade JSL can supply.
                        </div>
                      )}

                      {jslAlt && (
                        <div className="flag jsl fadein" key={"j" + jslAlt.n}>
                          <b>Jindal Stainless option. </b>
                          {jslAlt.n} also passes every requirement, at {jslAlt.ci.toFixed(2)}× the
                          cost of 304{jslAlt.ci < top.ci
                            ? `, about ${Math.round((1 - jslAlt.ci / top.ci) * 100)}% less than ${top.n}`
                            : ""}. It ranks {ranked.indexOf(jslAlt) + 1} of {ranked.length} on your priorities.
                          {jslAlt.src !== "JSL" && " Properties from a dealer sheet, confirm with JSL."}
                        </div>
                      )}

                      {despec && (
                        <div className="flag">
                          <b>You may be over-specifying. </b>
                          {despec.n} passes every requirement too, at {despec.ci.toFixed(2)}×
                          instead of {top.ci.toFixed(2)}× — about{" "}
                          {Math.round((1 - despec.ci / top.ci) * 100)}% less material cost.
                          It ranks lower only because of the priorities you set, not because
                          it would fail.
                        </div>
                      )}
                    </div>

                    <div>
                      <div className="rec">
                        <p className="kick">RECOMMENDED</p>
                        <div className="gname">{top.n}</div>
                        <p className="gsub">{FAMILY_PLAIN[top.f]}</p>
                        {eng && (
                          <div style={{ marginTop: 14 }}>
                            {top.u && <div className="kv"><span>UNS</span><b>{top.u}</b></div>}
                            {top.e && <div className="kv"><span>EN</span><b>{top.e}</b></div>}
                            <div className="kv"><span>Est. CPT</span><b>{top.cpt.toFixed(0)}°C</b></div>
                            <div className="kv"><span>SCC limit</span><b>{top.scc}°C</b></div>
                            <div className="kv"><span>Made by JSL</span><b>{top.mk ? "Yes" : "No"}</b></div>
                            {top.jsl && <div className="kv"><span>Data</span><b>{top.src === "JSL" ? "JSL datasheet" : "Dealer sheet"}</b></div>}
                          </div>
                        )}
                      </div>
                      <ResponsiveContainer width="100%" height={215}>
                        <RadarChart data={radar} outerRadius={68}>
                          <PolarGrid stroke={dark ? "#3A424C" : LINE} />
                          <PolarAngleAxis dataKey="k" tick={{ fontSize: 10, fill: tickC }} />
                          <Radar dataKey="v" stroke={ORANGE} fill={ORANGE}
                            fillOpacity={0.22} strokeWidth={2} />
                        </RadarChart>
                      </ResponsiveContainer>
                      <p className="legend" style={{ textAlign: "center" }}>
                        Further out is better
                      </p>
                    </div>
                  </div>
                </div>
              )}

              {ranked.length > 1 && (
                <div className="panel">
                  <div className="panel-h">
                    <h2>Other grades that would also work</h2>
                    <span>{ranked.length} of {GRADES.length} qualify</span>
                  </div>
                  <div className="pad">
                    <table>
                      <thead><tr>
                        <th style={{ width: 26 }} /><th>Grade</th>
                        {eng && <th>PREN</th>}<th>Yield</th><th>Cost</th>
                        <th style={{ width: "24%" }}>Fit</th>
                      </tr></thead>
                      <tbody>
                        {ranked.slice(0, 8).map((g, i) => (
                          <tr key={g.n}>
                            <td className="num" style={{ color: STEEL }}>{i + 1}</td>
                            <td><span className="fam" style={{ background: FAM_COLOR[g.f] }} />{g.n}
                              {g.jsl ? <span className="jtag">JSL</span>
                                : !g.mk && <span className="ntag">not JSL</span>}
                              {i > 0 && isTied(g) && <span className="tietag">≈ tied</span>}</td>
                            {eng && <td>{g.pren.toFixed(1)}</td>}
                            <td>{g.ys ?? "—"}</td>
                            <td>{g.ci.toFixed(2)}×</td>
                            <td><span className="bar" style={{
                              width: `${Math.max(3, g.score / ranked[0].score * 100)}%`,
                              opacity: 0.35 + 0.65 * (g.score / ranked[0].score),
                            }} /></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              <div className="panel">
                <div className="panel-h">
                  <h2>Corrosion resistance against price</h2>
                  <span>solid = works here · faded = ruled out</span>
                </div>
                <div className="pad">
                  <ResponsiveContainer width="100%" height={300}>
                    <ScatterChart margin={{ top: 8, right: 14, bottom: 24, left: 4 }}>
                      <CartesianGrid stroke={gridC} />
                      <XAxis type="number" dataKey="x" domain={[0.35, 2.45]}
                        tick={{ fontSize: 11, fill: tickC }}
                        label={{ value: "Cost, relative to 304", position: "bottom",
                          offset: 6, fontSize: 11, fill: tickC }} />
                      <YAxis type="number" dataKey="y" domain={[8, 48]}
                        tick={{ fontSize: 11, fill: tickC }}
                        label={{ value: eng ? "PREN" : "Corrosion resistance",
                          angle: -90, position: "insideLeft", fontSize: 11, fill: tickC }} />
                      <ZAxis range={[72, 72]} />
                      <Tooltip cursor={{ strokeDasharray: "3 3" }}
                        content={({ payload }) => {
                          if (!payload || !payload.length) return null;
                          const d = payload[0].payload;
                          return (
                            <div style={{ background: dark ? "#22272E" : WHITE, color: dark ? "#E6E9ED" : INK,
                              borderRadius: 12, border: dark ? "none" : `1px solid ${LINE}`,
                              padding: "8px 11px", fontSize: 13 }}>
                              {d.n}<br />
                              {eng ? `PREN ${d.y.toFixed(1)} · ` : ""}{d.x.toFixed(2)}× the cost of 304<br />
                              <span style={{ color: d.live ? GREEN : RED }}>
                                {d.live ? `works here, ranked ${d.rank}` : "ruled out"}
                              </span>
                            </div>
                          );
                        }} />
                      {Object.keys(FAM_COLOR).map((fam) => (
                        <Scatter key={fam} data={scatter.filter((d) => d.f === fam && d.live)}
                          fill={FAM_COLOR[fam]} fillOpacity={0.9} />
                      ))}
                      <Scatter data={scatter.filter((d) => !d.live)}
                        fill={offC} fillOpacity={0.6} />
                      {top && <ReferenceLine y={top.pren} stroke={ORANGE} strokeDasharray="4 4" />}
                    </ScatterChart>
                  </ResponsiveContainer>
                  <p className="legend">
                    Best value sits high and to the left. Anything faded failed one of
                    your requirements.
                  </p>
                </div>
              </div>

              <div className="panel">
                <div className="panel-h">
                  <h2>Why the rest were ruled out</h2>
                  <button className="pre" onClick={() => setShowCut(!showCut)}>
                    {showCut ? "Hide" : `Show all ${cut.length}`}
                  </button>
                </div>
                {showCut && (
                  <div className="pad anim">
                    <table><tbody>
                      {cut.map((g) => (
                        <tr key={g.n} className="cutrow"
                          onClick={() => setOpen(open === g.n ? null : g.n)}>
                          <td style={{ width: 118 }}>
                            <span className="fam" style={{ background: FAM_COLOR[g.f] }} />{g.n}
                          </td>
                          <td>
                            {(open === g.n ? g.reasons : g.reasons.slice(0, 1)).map((r, i) => (
                              <div className="rsn" key={i}>
                                {r.plain}{eng && <span className="tech">  ({r.tech})</span>}
                              </div>
                            ))}
                            {open !== g.n && g.reasons.length > 1 && (
                              <div style={{ fontSize: 12.5, color: STEEL }}>
                                and {g.reasons.length - 1} more — tap to see
                              </div>
                            )}
                          </td>
                        </tr>
                      ))}
                    </tbody></table>
                  </div>
                )}
              </div>
            </main>
          </div>
        </div>

        <footer className="foot">
          {eng ? (
            <>
              Screening aid, not a specification. Above {AQUEOUS_LIMIT}°C there is no liquid water,
              so oxidation resistance governs. In air, each chloride band maps to a minimum PREN
              following the corrosion resistance classes of EN 1993-1-4, with a stricter level
              when appearance matters. In wet service the minimum PREN is interpolated from the
              common water guidance (304 to about 200 ppm, 316 to about 1000 ppm, 2205 to about
              3600 ppm, superduplex for seawater) and rises 0.08 per °C above 25°C. Austenitic
              grades are screened out above 60°C in chloride for stress corrosion cracking, and
              unstabilised grades are flagged for weld decay only in wet chloride service. Yield
              below 70% of the requirement is rejected; above that, strength is scored, since a
              thicker section compensates. Est. CPT uses <code>CPT = 2.989·PREN − 56.44</code>,
              fitted to ten ASTM G48-A results at R² = 0.914. Jindal Stainless grades use JSL's
              200-series brochure; JT is from a dealer sheet. Cost indices are estimates relative
              to 304. Surface finish, crevices, deposits, weld quality and galvanic coupling are
              outside the model.
            </>
          ) : (
            <>
              This narrows the field, it does not write your specification. It assumes clean,
              properly finished metal and does not account for crevices, deposits, dissimilar
              metals bolted together, or poor welding. For anything safety critical or
              expensive, confirm with a materials engineer. Turn on engineering detail to see
              every number and assumption behind the answer.
            </>
          )}
        </footer>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<GradeSelector />);
</script>
</body>
</html>
